openapi: 3.0.3
info:
  title: Equipment Service API
  version: 1.0.0
  description: API documentation for equipment categories, inventory, import tickets, and install tickets.
servers:
  - url: http://localhost:3004
    description: Local development server
tags:
  - name: Equipment Categories
  - name: Equipments
  - name: Import Tickets
  - name: Install Tickets

paths:
  /categories/out-of-stock:
    get:
      tags: [Equipment Categories]
      summary: Get out-of-stock categories
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Out-of-stock categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/EquipmentCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /categories:
    get:
      tags: [Equipment Categories]
      summary: Get all equipment categories
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: warehouse
          schema:
            type: string
            enum: [housekeeping, fb, technical]
        - in: query
          name: type
          schema:
            type: string
            enum: [single, quantity]
        - in: query
          name: keyword
          schema:
            type: string
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  total: { type: integer }
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/EquipmentCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [Equipment Categories]
      summary: Create equipment category
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEquipmentCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  category: { $ref: "#/components/schemas/EquipmentCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /categories/{id}:
    get:
      tags: [Equipment Categories]
      summary: Get equipment category by id
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Category detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  category: { $ref: "#/components/schemas/EquipmentCategory" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [Equipment Categories]
      summary: Update equipment category
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEquipmentCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  category: { $ref: "#/components/schemas/EquipmentCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Equipment Categories]
      summary: Delete equipment category
      description: Use `force=true` to force deletion if supported by service logic.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - in: query
          name: force
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Category deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /categories/sync-quantities:
    post:
      tags: [Equipment Categories]
      summary: Sync category quantity counters
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      total_categories: { type: integer }
                      updated_categories: { type: integer }
                      details:
                        type: array
                        items: { $ref: "#/components/schemas/GenericObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /:
    get:
      tags: [Equipments]
      summary: Get all equipments
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: category_id
          schema: { type: string }
        - in: query
          name: room_id
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [in-stock, installing, removing, in-use, maintenance, lost, disposed]
        - in: query
          name: condition
          schema:
            type: string
            enum: [new, good, maintenance, broken]
      responses:
        "200":
          description: Equipment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  equipments:
                    type: array
                    items: { $ref: "#/components/schemas/Equipment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /{id}:
    get:
      tags: [Equipments]
      summary: Get equipment by id
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Equipment detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  equipment: { $ref: "#/components/schemas/Equipment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [Equipments]
      summary: Update equipment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEquipmentRequest"
      responses:
        "200":
          description: Equipment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  equipment: { $ref: "#/components/schemas/Equipment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Equipments]
      summary: Delete equipment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Equipment deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/import:
    get:
      tags: [Import Tickets]
      summary: Get all equipment import tickets
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, waiting_confirm, completed, expired]
        - in: query
          name: import_date
          schema: { type: string, format: date }
      responses:
        "200":
          description: Import ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  total_tickets: { type: integer }
                  tickets:
                    type: array
                    items: { $ref: "#/components/schemas/ImportTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [Import Tickets]
      summary: Create equipment import ticket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportTicketRequest"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  ticket_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/import/auto-create:
    post:
      tags: [Import Tickets]
      summary: Auto-create import ticket for out-of-stock categories
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Auto ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  ticket_id: { type: string }
                  items_count: { type: integer }
                  import_date: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/import/{id}:
    get:
      tags: [Import Tickets]
      summary: Get import ticket by id
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  ticket: { $ref: "#/components/schemas/ImportTicket" }
                  ticket_details:
                    type: array
                    items: { $ref: "#/components/schemas/ImportDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [Import Tickets]
      summary: Update import ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateImportTicketRequest"
      responses:
        "200":
          description: Ticket updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Import Tickets]
      summary: Delete import ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - in: query
          name: force
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Ticket deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/import/mark-confirmed/{id}:
    post:
      tags: [Import Tickets]
      summary: Confirm import ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Ticket confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /statistics/reports/json:
    get:
      tags: [Equipments]
      summary: Generate equipment report as JSON
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Equipment report data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericObject" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /statistics/reports/excel:
    get:
      tags: [Equipments]
      summary: Export equipment report as Excel
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /statistics/reports/pdf:
    get:
      tags: [Equipments]
      summary: Export equipment report as PDF
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: PDF file download
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/install/smart-suggestions/{roomId}:
    get:
      tags: [Install Tickets]
      summary: Get smart install suggestions for a room (manager)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Install suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  suggestions:
                    type: array
                    items: { $ref: "#/components/schemas/GenericObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/install/my:
    get:
      tags: [Install Tickets]
      summary: Get my assigned install tickets (employee)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, assigned, waiting_confirm, completed, expired]
      responses:
        "200":
          description: My install tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  installs:
                    type: array
                    items: { $ref: "#/components/schemas/InstallTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/install:
    post:
      tags: [Install Tickets]
      summary: Create install ticket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstallTicketRequest"
      responses:
        "201":
          description: Install ticket created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessDataResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    get:
      tags: [Install Tickets]
      summary: Get all install tickets
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: room_id
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, assigned, waiting_confirm, completed, expired]
        - in: query
          name: type
          schema:
            type: string
            enum: [install, uninstall]
      responses:
        "200":
          description: Install ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  counts: { type: integer }
                  installs:
                    type: array
                    items: { $ref: "#/components/schemas/InstallTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/uninstall:
    post:
      tags: [Install Tickets]
      summary: Create uninstall ticket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstallTicketRequest"
      responses:
        "201":
          description: Uninstall ticket created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessDataResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/install/{id}:
    get:
      tags: [Install Tickets]
      summary: Get install ticket by id
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Install ticket detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  install: { $ref: "#/components/schemas/InstallTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [Install Tickets]
      summary: Update install ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstallTicketRequest"
      responses:
        "200":
          description: Install ticket updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessDataResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Install Tickets]
      summary: Delete install ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Install ticket deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/install/mark-started/{id}:
    post:
      tags: [Install Tickets]
      summary: Employee marks install ticket started
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Ticket started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessDataResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/install/mark-completed/{id}:
    post:
      tags: [Install Tickets]
      summary: Employee marks install ticket completed
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Ticket completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessDataResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tickets/install/mark-confirmed/{id}:
    post:
      tags: [Install Tickets]
      summary: Manager confirms install ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Ticket confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessDataResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalServerError:
      description: Server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
      required: [message]

    SuccessMessageResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
      required: [success, message]

    SuccessDataResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          oneOf:
            - $ref: "#/components/schemas/GenericObject"
            - type: array
              items: { $ref: "#/components/schemas/GenericObject" }
      additionalProperties: true

    GenericObject:
      type: object
      additionalProperties: true

    EquipmentCategory:
      type: object
      properties:
        _id: { type: string }
        warehouse:
          type: string
          enum: [housekeeping, fb, technical]
        type:
          type: string
          enum: [single, quantity]
        name: { type: string }
        description: { type: string }
        unit:
          type: string
          enum: [item, box, "Cái", "Bộ"]
        price: { type: number }
        storage_quantity: { type: integer }
        total_quantity: { type: integer }
        image: { type: string, nullable: true }
      additionalProperties: true

    Equipment:
      type: object
      properties:
        _id: { type: string }
        category_id: { type: string }
        room_id: { type: string, nullable: true }
        import_ticket_id: { type: string }
        install_ticket_id: { type: string, nullable: true }
        condition:
          type: string
          enum: [new, good, maintenance, broken]
        status:
          type: string
          enum: [in-stock, installing, removing, in-use, maintenance, lost, disposed]
