openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: API documentation for user notifications management.
servers:
  - url: http://localhost:3007
    description: Local development server
tags:
  - name: Notifications

paths:
  /:
    get:
      tags: [Notifications]
      summary: Get my notifications
      description: Returns up to 20 latest notifications for current user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                required: [success, notifications]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /{id}:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationIdParam"
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Notifications]
      summary: Mark notification as deleted
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationIdParam"
      responses:
        "200":
          description: Notification marked as deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    NotificationIdParam:
      name: id
      in: path
      required: true
      description: Notification identifier
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
      required: [message]

    SuccessMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
      required: [success, message]

    NotificationReference:
      type: object
      properties:
        kind:
          type: string
          enum:
            - Order
            - Discount
            - Booking
            - User
            - InstallTicket
            - InstallDetail
            - CleaningTask
            - Schedule
            - ScheduleContract
        refId:
          type: string
      additionalProperties: false

    Notification:
      type: object
      properties:
        _id:
          type: string
        user_id:
          type: string
        title:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [booking, discount, system, equipment, other, room, schedule]
        reference:
          $ref: "#/components/schemas/NotificationReference"
        status:
          type: string
          enum: [read, unread, deleted]
        read_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true
